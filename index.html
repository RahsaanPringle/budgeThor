<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Budgethor helps you import transactions, schedule recurring items, and project future balances.">
    <title>Budgethor - Budgeting App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Budgethor</h1>
            <p>Your budgeting companion</p>
        </header>
        <nav>
            <button id="transactionsTab">Transactions</button>
            <button id="scheduleTab">Schedule Repeating</button>
            <button id="projectionsTab">Projections</button>
        </nav>
        <main>
            <section id="transactionsSection" class="tab-content active">
                <h2>Transactions</h2>
                <div class="upload-section">
                    <label for="csvUpload" class="sr-only">Select one or more CSV transaction files</label>
                    <input type="file" id="csvUpload" accept=".csv" multiple>
                    <button id="importBtn">Import Transactions</button>
                </div>
                <div id="transactionsTableContainer">
                    <table id="transactionsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Account</th>
                                <th>ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Transactions will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="scheduleSection" class="tab-content">
                <h2>Schedule Repeating Transactions</h2>
                <form id="scheduleForm">
                    <div>
                        <label for="scheduleDate">Start Date:</label>
                        <input type="date" id="scheduleDate" required>
                    </div>
                    <div>
                        <label for="scheduleDescription">Description:</label>
                        <input type="text" id="scheduleDescription" required>
                    </div>
                    <div>
                        <label for="scheduleAmount">Amount:</label>
                        <input type="number" id="scheduleAmount" step="0.01" required>
                    </div>
                    <div>
                        <label for="scheduleFrequency">Frequency:</label>
                        <select id="scheduleFrequency" required>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="biweekly">Bi-weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                    <div>
                        <label for="scheduleEndDate">End Date (optional):</label>
                        <input type="date" id="scheduleEndDate">
                    </div>
                    <button type="submit" id="scheduleSubmitBtn">Add Schedule</button>
                    <button type="button" id="cancelEditScheduleBtn" class="cancel-button" style="display: none;">Cancel
                        Edit</button>
                </form>
                <div id="schedulesList">
                    <h3>Scheduled Transactions</h3>
                    <div class="schedule-toolbar">
                        <button id="exportSchedulesJsonBtn" class="small-button export-button" type="button">Export JSON
                            Schedule</button>
                        <button id="importSchedulesJsonBtn" class="small-button edit-button" type="button">Import JSON
                            Schedule</button>
                        <button id="exportSchedulesCsvBtn" class="small-button export-button" type="button">Export
                            Recurring Items CSV</button>
                        <input type="file" id="scheduleJsonUpload" class="hidden-file-input"
                            accept=".json,application/json" aria-label="Import recurring schedule JSON file">
                    </div>
                    <div id="schedulesTableContainer"></div>
                </div>
            </section>

            <section id="projectionsSection" class="tab-content">
                <h2>Projections</h2>
                <div>
                    <label for="projectionStartDate">Start Date:</label>
                    <input type="date" id="projectionStartDate">
                </div>
                <p class="projection-note">Projections are shown as a transaction-by-transaction ledger
                    with a running balance.</p>
                <div>
                    <label for="projectionMonths">Months to Project:</label>
                    <input type="number" id="projectionMonths" value="12" min="1">
                </div>
                <div class="projection-toolbar">
                    <button id="generateProjectionBtn" class="small-button edit-button" type="button">Generate
                        Projection</button>
                    <button id="exportProjectionsJsonBtn" class="small-button export-button" type="button">Export JSON
                        Projections</button>
                    <button id="importProjectionsJsonBtn" class="small-button edit-button" type="button">Import JSON
                        Projections</button>
                    <button id="exportProjectionsCsvBtn" class="small-button export-button" type="button">Export CSV
                        Projections</button>
                    <button id="importProjectionsCsvBtn" class="small-button edit-button" type="button">Import CSV
                        Projections</button>
                    <input type="file" id="projectionJsonUpload" class="hidden-file-input"
                        accept=".json,application/json" aria-label="Import projections JSON file">
                    <input type="file" id="projectionCsvUpload" class="hidden-file-input" accept=".csv,text/csv"
                        aria-label="Import projections CSV file">
                </div>
            </section>
            <div id="projectionResult">
                <h3>Projection Result</h3>
                <!-- Projection table will be inserted here -->
            </div>
        </main>
    </div>
    <script src="js/app.js" defer></script>
</body>

</html>
